x-internal-no-proxy-env: &internal-no-proxy-env
  NO_PROXY: "localhost,127.0.0.1,127.0.0.0/8,::1,0.250.250.0/24,*.orb.internal,*.orb.local,vm.orb.internal,services.orb.internal,services2.orb.internal,proxyproxy.orb.internal,gateway.orb.internal,gateway.docker.internal,host.internal,host.orb.internal,host.docker.internal,host.lima.internal,docker.orb.internal,docker.orb.local,k8s.orb.local,docker.for.mac.localhost,docker.for.mac.host.internal,postgres,tempo,loki,grafana,otel-collector,inventory-postgres,inventory-tempo,inventory-loki,inventory-grafana,inventory-otel-collector"
  no_proxy: "localhost,127.0.0.1,127.0.0.0/8,::1,0.250.250.0/24,*.orb.internal,*.orb.local,vm.orb.internal,services.orb.internal,services2.orb.internal,proxyproxy.orb.internal,gateway.orb.internal,gateway.docker.internal,host.internal,host.orb.internal,host.docker.internal,host.lima.internal,docker.orb.internal,docker.orb.local,k8s.orb.local,docker.for.mac.localhost,docker.for.mac.host.internal,postgres,tempo,loki,grafana,otel-collector,inventory-postgres,inventory-tempo,inventory-loki,inventory-grafana,inventory-otel-collector"

services:
  keycloak-postgres:
    image: postgres:17.5-alpine
    profiles: ["identity"]
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - inventory-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    profiles: ["identity"]
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_SMOKE_AGENT_SECRET: ${KEYCLOAK_SMOKE_AGENT_SECRET}
      KEYCLOAK_HERMES_AGENT_SECRET: ${KEYCLOAK_HERMES_AGENT_SECRET}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/keycloak.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/keycloak-key.pem
      # With TLS configured the management interface (9000) turns HTTPS, which the
      # plain /dev/tcp healthcheck cannot speak. Serve health on the main HTTP
      # listener (8080) instead; deprecated flag but fine until KC offers http-management-scheme.
      KC_LEGACY_OBSERVABILITY_INTERFACE: "true"
    ports:
      - "${IDENTITY_BIND_HOST:-127.0.0.1}:${KEYCLOAK_PORT:-8180}:8080"
      - "${IDENTITY_BIND_HOST:-127.0.0.1}:${KEYCLOAK_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./infra/keycloak/realm-home-service-hub.json:/opt/keycloak/data/import/realm-home-service-hub.json:ro
      - ./infra/keycloak/certs:/opt/keycloak/certs:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - inventory-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # --- 1. 資料庫 ---
  postgres:
    image: postgres@sha256:b3968e348b48f1198cc6de6611d055dbad91cd561b7990c406c3fc28d7095b21
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${INVENTORY_DB} # 這裡預設起庫存 DB
    ports:
      - "${INFRA_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventory-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- 4. OpenTelemetry Collector ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:213886eb6407af91b87fa47551c3632be1a6419ff3a5114ef1e6fc364628496f
    container_name: inventory-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      <<: *internal-no-proxy-env
    volumes:
      - ./infra/config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - "${STREAMER_DVR_LOG_DIR:-../streamer-rec/streamer-dvr/logs}:/var/log/streamer-dvr:ro"
    ports:
      - "${INFRA_BIND_HOST:-127.0.0.1}:4317:4317"
      - "${INFRA_BIND_HOST:-127.0.0.1}:4318:4318"
    depends_on:
      - tempo
      - loki
    networks:
      - inventory-net

  # --- 5. 監控 (Tempo, Loki, Grafana) ---
  tempo:
    image: grafana/tempo@sha256:feb779230ff7ba69900b17e157360c3e056e8a58123f9fb5ea29ac40ebf5531b
    container_name: inventory-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "${INFRA_BIND_HOST:-127.0.0.1}:3200:3200"
    volumes:
      - ./infra/config/tempo.yaml:/etc/tempo.yaml
      - ./infra/tempo-data:/var/tempo
    networks:
      - inventory-net

  loki:
    image: grafana/loki@sha256:be31579ac047e9f78b81e48f3b69d3af709e7299b431d5aa78bcda43382f9511
    container_name: inventory-loki
    ports:
      - "${INFRA_BIND_HOST:-127.0.0.1}:3100:3100"
      - "${INFRA_BIND_HOST:-127.0.0.1}:9096:9096"
    volumes:
      - ./infra/config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - inventory-net

  grafana:
    image: grafana/grafana@sha256:2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f
    container_name: inventory-grafana
    ports:
      - "127.0.0.1:3000:3000"
      - "${GRAFANA_VPN_BIND_HOST:-127.0.0.2}:3000:3000"
    environment:
      <<: *internal-no-proxy-env
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - loki
      - tempo
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/config/grafana-config.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./infra/config/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/config/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge

volumes:
  postgres_data:
  keycloak_postgres_data:
  loki_data:
  grafana_data:
